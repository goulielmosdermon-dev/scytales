<!DOCTYPE html>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dotted globe</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;position:relative}
  html.static,html.static body{
    background:
      radial-gradient(ellipse 140% 95% at 50% 68%, #000F2E 0%, #000C24 28%, transparent 68%),
      radial-gradient(ellipse 100% 70% at 50% 55%, #001540 0%, #000D28 35%, transparent 72%),
      radial-gradient(ellipse 70% 40% at 50% 50%, #001A4D 0%, transparent 55%),
      #000F2E;
  }
  /* Site embed: transparent so the page’s impact-earth gradient shows through */
  html.static.site,html.static.site body{
    background: transparent;
  }
  canvas{display:block;width:100%;height:100%;cursor:grab;background:transparent}
  canvas:active{cursor:grabbing}
  #coords{
    position:absolute; left:12px; bottom:12px; z-index:5;
    margin:0; padding:8px 10px;
    font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color:#e8eef5; background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.12); border-radius:8px;
    pointer-events:none; white-space:pre; backdrop-filter:blur(6px);
  }
  html:not(.static) #coords{display:none}
  html.static.site #coords{display:none}
</style>

<canvas id="c"></canvas>
<pre id="coords">lat — · lon —</pre>

//////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPgAAH/////////////////////////////////////////////////////////////////////8AAAAAAAAA8AAAP/+AAAAAJ////////+AAAAAAAAAAAAgAAAAA///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//////////////////////////////////////////////////////////////////////wAAAAAAAA8AAAB//gAAAAP/////////gAAAAAAAAAAB////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB///////////////////////////////////////////////////////////////////////AAAAAAAAH//////gAAAAP//////+AAAAAAAAAAAAA///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH//////////////////////////////////////////////////////////////////////4AAAfgAAAAf////wAAAAP////4AAAAAAAAAAAAH/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//////////////////////////////////////////////////////////////////////DwH/+AAAAAIH//8AAAAD////wAAAAAAAAAAAAP/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH///////////////////////////////////////////////////////////////////////////////AAAAAB/8AAAAAQAAAAAAAAAAAAB/8D///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH///////////////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAf//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB/wAAAAP/////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAA///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf//4AAAAD///////////////////////////////////////////////////////////////////////////////////////4AAAAAAAAAAAAAAAAAAA////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAAAAH///////////////////////////////////////////////////////////////////////////////////////gAAAAAAAAAAAAAAAAAA/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHwAAB/////////////////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAIAAAAB//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPgAB////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAH/////AAD///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAA///////////////////////////////////////////////////////////////////////////////////8AAEAcAAAAAD///////4AB////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB///////////////////////////////////////////////////////////////////////////////////////+AAAAAH///////8H////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////4D+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/////////////////////////////////////////////////////////////////////////////////////+AAAAAP/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////////////////////////////////////////////////////////////////////////////////////+AAAAAH///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAA///wAAAAAA/4AAAAAAf///////////////////////////////////////////////////////////////////////////////////////4QAAH/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAB///gAAAAH/4AAA///////////////////////////////////////////////////////////////////////////////////////////8AAP//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAAAAAP/////8AAAAAAH///////////////////////////////////////////////////////////////////////////////////////////AAf//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////+AAAAAAAAAAAAAAAAAAAAB//////wA+AD///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////+AAAAAAAAAAAAAAAAAAH//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////+AAAAAAAAAAAAAAAAAAH/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAD//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////gAAAAAAAAAAAAAAAAAH/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wP/gAAAAAAAAAAAP//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8AAAAAH/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////+AAAAAAA///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8AAAB///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////AAA///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// const isLand = (lon, lat) => {
  const x = ((lon + 180) / 360 * MASK_W) | 0;
  const y = ((90 - lat) / 180 * MASK_H) | 0;
  if (y < 0 || y >= MASK_H) return false;
  const xi = ((x % MASK_W) + MASK_W) % MASK_W;
  return (MASK[y * ROW_BYTES + (xi >> 3)] >> (7 - (xi & 7))) & 1;
};

// ---------- config ----------
const R          = 1;        // globe radius
const DOTS       = STATIC ? 88000 : 22000;  // land dots (4× base in static style-guide)
const DOT_PX     = 0.48;   // global dot-size multiplier, in CSS pixels
/* Yellow-orange ramp — 2× saturation vs prior amber set */
function sat2x(hex) {
  const c = new THREE.Color(hex);
  const hsl = {};
  c.getHSL(hsl);
  c.setHSL(hsl.h, Math.min(1, hsl.s * 2), hsl.l);
  return c;
}
const ORANGE      = sat2x('#F2A03A');  // vivid yellow-orange
const ORANGE_MARK = sat2x('#F5B04A');  // bright amber
const ORANGE_SOFT = sat2x('#F7C878');  // soft gold-peach
const ORANGE_PALE = sat2x('#FBE8C8');  // pale warm cream
const WHITE       = new THREE.Color('#FFFFFF');
const WHITE_SOFT  = new THREE.Color('#E8EEF5');
const WHITE_DIM   = new THREE.Color('#C5D0DC');

// ---------- sample land points ----------
// Uniform on the sphere: z uniform in [-1,1], angle uniform in [0,2pi).
// Anything else bunches at the poles.
const pos   = [];
const col   = [];
const size  = [];
const alpha = [];
const dotLat = [];
const dotLon = [];

let placed = 0, guard = 0;
while (placed < DOTS && guard++ < DOTS * 40) {
  const u   = Math.random() * 2 - 1;
  const th  = Math.random() * Math.PI * 2;
  const lat = Math.asin(u) * 180 / Math.PI;
  const lon = th * 180 / Math.PI - 180;
  if (!isLand(lon, lat)) continue;

  const s = Math.sqrt(1 - u * u);
  pos.push(s * Math.cos(th) * R, u * R, s * Math.sin(th) * R);
  dotLat.push(lat);
  dotLon.push(lon);

  const roll = Math.random();
  let c;
  if (STATIC) {
    c = roll < 0.18 ? WHITE : roll < 0.55 ? WHITE_SOFT : WHITE_DIM;
  } else {
    c = roll < 0.12 ? ORANGE_PALE
      : roll < 0.40 ? ORANGE_SOFT
      : roll < 0.70 ? ORANGE_MARK
      : ORANGE;
  }
  col.push(c.r, c.g, c.b);
  size.push(1.25 + Math.random() * 2.0);
  alpha.push(0.72 + Math.random() * 0.28);
  placed++;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
geo.setAttribute('aColor',   new THREE.Float32BufferAttribute(col, 3));
geo.setAttribute('aSize',    new THREE.Float32BufferAttribute(size, 1));
geo.setAttribute('aAlpha',   new THREE.Float32BufferAttribute(alpha, 1));
const baseLandColors = new Float32Array(col); // restore palette when leaving a state
const baseLandSizes = new Float32Array(size);

// ---------- point material ----------
// Round dots, per-point size, and a far-side fade so the sphere reads
// as a sphere. Without the fade you get a flat disc of noise; the
// dense rim you see in the reference is just this fade plus the fact
// that a sphere's surface crowds up at the silhouette.
const dotMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uScale:    { value: 1 },
    uBack:     { value: 0.10 },
    uHover:    { value: new THREE.Vector3(0, 1, 0) },
    uHoverAmt: { value: 0 },
    uTime:     { value: 0 },
    uWaveR:    { value: 0.42 },  // angular radius of ripple
    uWaveH:    { value: 0.04 },  // peak displacement along normal
    // Multiplies every dot colour. White = untouched. Driven live by the
    // parent page's Colour Lab via postMessage (see the listener below).
    uTint:     { value: new THREE.Color('#FFFFFF') },
  },
  vertexShader: `
    attribute vec3 aColor; attribute float aSize; attribute float aAlpha;
    uniform float uScale, uBack, uHoverAmt, uTime, uWaveR, uWaveH;
    uniform vec3 uHover;
    varying vec3 vColor; varying float vAlpha;
    void main(){
      vColor = aColor;
      vec3 nLoc = normalize(position);
      vec3 hDir = normalize(uHover);
      float ang = acos(clamp(dot(nLoc, hDir), -1.0, 1.0));
      float fall = 1.0 - smoothstep(0.0, uWaveR, ang);
      fall *= fall;
      float ripple = sin(ang * 26.0 - uTime * 7.5);
      float lift = uWaveH * uHoverAmt * fall * (0.55 + 0.45 * ripple);
      vec3 pos = position + nLoc * lift;

      vec4 world = modelMatrix * vec4(pos, 1.0);
      vec3 n     = normalize(mat3(modelMatrix) * nLoc);
      vec3 toCam = normalize(cameraPosition - world.xyz);
      float face = dot(n, toCam);
      vAlpha = aAlpha * mix(uBack, 1.0, smoothstep(-0.25, 0.30, face));
      vec4 mv = viewMatrix * world;
      gl_PointSize = aSize * uScale / -mv.z * (1.0 + 0.35 * fall * uHoverAmt);
      gl_Position  = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vColor; varying float vAlpha;
    uniform vec3 uTint;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float a = smoothstep(0.5, 0.34, length(d));   // soft round dot
      if (a < 0.01) discard;
      gl_FragColor = vec4(vColor * uTint, vAlpha * a);
    }`
});

/* ---- live colour control from the host page ----------------------------
   ?tint=RRGGBB sets the initial dot tint; the parent can change it at any
   time with postMessage({ type: 'globe-tint', tint: '#RRGGBB' }). */
{
  const p = new URLSearchParams(location.search).get('tint');
  if (p) dotMat.uniforms.uTint.value.set(`#${p.replace(/^#/, '')}`);
  addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || msg.type !== 'globe-tint') return;
    try {
      if (typeof msg.tint === 'string') dotMat.uniforms.uTint.value.set(msg.tint);
      if (typeof msg.lightCol === 'string') bodyMat.uniforms.uLightCol.value.set(msg.lightCol);
      if (typeof msg.darkCol === 'string') bodyMat.uniforms.uDarkCol.value.set(msg.darkCol);
      if (typeof msg.soft === 'number') bodyMat.uniforms.uSoft.value = msg.soft;
      /* angle sweeps the light around the face of the sphere; elevation tips
         it from the rim (0°) toward the viewer (90°), moving the bright spot
         from the edge to the centre. */
      if (typeof msg.angle === 'number' || typeof msg.elev === 'number') {
        const a = (msg.angle ?? 135) * Math.PI / 180;
        const e2 = (msg.elev ?? 42) * Math.PI / 180;
        bodyMat.uniforms.uLight.value
          .set(Math.cos(a) * Math.cos(e2), Math.sin(a) * Math.cos(e2), Math.sin(e2))
          .normalize();
      }
    } catch {
      /* ignore an unparseable value */
    }
  });
}

// ---------- scene ----------
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: false });
renderer.setClearColor(0x000000, 0);
renderer.setClearAlpha(0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 100);
const BASE_Z = 2.05;              // 2× apparent size vs 4.1
/* The framing above was tuned on a wide desktop cell. Because the FOV is
   vertical, a narrow frame shrinks the visible width until the globe (R = 1)
   no longer fits and reads as a field of loose dots. Below this aspect the
   camera pulls back to hold the globe's on-screen width. */
const REF_ASPECT = 1.6;
camera.position.set(0, 0, BASE_Z);

const globe = new THREE.Group();
// Site: sit closer under the impact stats. Style-guide static stays lower in its stage.
globe.position.y = SITE ? -0.48 : (STATIC ? -0.7 : -0.5);
scene.add(globe);

// Solid black Earth body only for static/style-guide Earth.
// Interoperability stays transparent so the cell background shows through.
/* Shaded body — a soft terminator across the sphere so the ball reads as a
   lit 3-D volume rather than a flat disc. The normal is taken into VIEW space,
   so the shading stays fixed to the camera while the globe spins underneath.
   uLight is a direction; the Colour Lab drives it from an angle + elevation. */
const bodyMat = new THREE.ShaderMaterial({
  toneMapped: false,
  uniforms: {
    uLight:    { value: new THREE.Vector3(0.7547, -0.6561, 0).normalize() },
    uLightCol: { value: new THREE.Color('#4194C8') },
    uDarkCol:  { value: new THREE.Color('#0B0061') },
    uSoft:     { value: 1.01 },   // terminator width (frozen Color Lab)
  },
  vertexShader: `
    varying vec3 vN;
    void main(){
      vN = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec3 vN;
    uniform vec3 uLight, uLightCol, uDarkCol;
    uniform float uSoft;
    void main(){
      float d = dot(normalize(vN), normalize(uLight));
      float t = smoothstep(-uSoft, 1.0, d);
      t = t * t * (3.0 - 2.0 * t);                 // ease the falloff
      gl_FragColor = vec4(mix(uDarkCol, uLightCol, t), 1.0);
    }`,
});

if (STATIC) {
  globe.add(new THREE.Mesh(new THREE.SphereGeometry(R * 0.992, 64, 48), bodyMat));
  dotMat.depthTest = true;
}
globe.add(new THREE.Points(geo, dotMat));

// Scattered background stars (static style-guide only) — world-space, not spinning with the globe
if (STATIC) {
  const sp = [], sc = [], ss = [], sa = [];
  const pushStar = (x, y, z, sizeLo, sizeHi, aLo, aHi) => {
    sp.push(x, y, z);
    const b = 0.45 + Math.random() * 0.5;
    sc.push(b, b, Math.min(1, b + 0.06));
    ss.push(sizeLo + Math.random() * (sizeHi - sizeLo));
    sa.push(aLo + Math.random() * (aHi - aLo));
  };
  // Sparse tiny field above / beside the globe
  for (let i = 0; i < 2200; i++) {
    const y = 0.55 + Math.random() * 2.0;
    const x = (Math.random() * 2 - 1) * 3.6;
    const z = -1.0 - Math.random() * 4.8;
    pushStar(x, y, z, 0.4, 0.85, 0.35, 0.85);
  }
  // Even finer side dust
  for (let i = 0; i < 1100; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const x = side * (1.1 + Math.random() * 2.6);
    const y = 0.3 + Math.random() * 2.0;
    const z = -1.0 - Math.random() * 5.0;
    pushStar(x, y, z, 0.32, 0.65, 0.25, 0.7);
  }
  // Extra faint fill across the sky band
  for (let i = 0; i < 800; i++) {
    pushStar(
      (Math.random() * 2 - 1) * 3.8,
      0.4 + Math.random() * 2.1,
      -1.2 - Math.random() * 5.5,
      0.28, 0.55, 0.2, 0.55
    );
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  starGeo.setAttribute('aColor',   new THREE.Float32BufferAttribute(sc, 3));
  starGeo.setAttribute('aSize',    new THREE.Float32BufferAttribute(ss, 1));
  starGeo.setAttribute('aAlpha',   new THREE.Float32BufferAttribute(sa, 1));
  const stars = new THREE.Points(starGeo, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, depthTest: true, toneMapped: false,
    uniforms: { uScale: { value: 1 } },
    vertexShader: `

// Recolor a random subset of EXISTING white land dots (no new points).
// Fractal noise on the sphere → irregular speckled clusters, not country chunks.
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function smoothstep(t) {
  return t * t * (3 - 2 * t);
}
function valueNoise2(x, y) {
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const fx = x - x0, fy = y - y0;
  const ux = smoothstep(fx), uy = smoothstep(fy);
  const a = hash2(x0, y0);
  const b = hash2(x0 + 1, y0);
  const c = hash2(x0, y0 + 1);
  const d = hash2(x0 + 1, y0 + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
// Multi-octave noise in lon/lat space (degrees), warped slightly for organic blobs
function fbmLand(lat, lon) {
  // Project to a continuous plane; scale so features are ~country-fragment sized
  let x = lon * 0.085 + 12.7;
  let y = lat * 0.11 - 3.4;
  // Domain warp — breaks up rectangular “chunks”
  const wx = valueNoise2(x * 0.55 + 2.1, y * 0.55 - 1.7);
  const wy = valueNoise2(x * 0.55 - 4.3, y * 0.55 + 8.2);
  x += (wx - 0.5) * 2.4;
  y += (wy - 0.5) * 2.4;

  let amp = 0.55, freq = 1, sum = 0, norm = 0;
  for (let o = 0; o < 5; o++) {
    sum += amp * valueNoise2(x * freq, y * freq);
    norm += amp;
    amp *= 0.5;
    freq *= 2.05;
  }
  return sum / norm;
}

function angDistDeg(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  const dφ = φ2 - φ1, dλ = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dλ / 2) ** 2;
  return 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 180 / Math.PI;
}

function centroidOfFlatXYZ(flat) {
  const n = (flat.length / 3) | 0;

  let x = 0, y = 0, z = 0;
  for (let i = 0; i < n; i++) {
    x += flat[i * 3];
    y += flat[i * 3 + 1];
    z += flat[i * 3 + 2];
  }
  x /= n; y /= n; z /= n;
  const len = Math.hypot(x, y, z) || 1;
  return [x / len, y / len, z / len];

function beginFaceSpin(toRotY, duration) {

function xyzFromLatLon(lat, lon, r = R * 1.004) {

  return [c * Math.cos(th) * r, Math.sin(φ) * r, c * Math.sin(th) * r];
}

function inGlyphTen(u, v) {

  const ox = (u - 0.38) / 0.58;
  const oy = v / 0.82;
  const r2 = ox * ox + oy * oy;
  const in0 = r2 < 1.0 && r2 > 0.38;
  return in1 || in0;
}

function greatCircle(aKey, bKey, segments = 128){
  const [aLat,aLon] = CITIES[aKey], [bLat,bLon] = CITIES[bKey];
  const va = ll(aLat, aLon, 1), vb = ll(bLat, bLon, 1);

  const alt = 0.06 + 0.34 * (ang / Math.PI);
  const s   = Math.sin(ang);
  const pts = [];
  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    const p = s < 1e-6
      ? va.clone().lerp(vb, t).normalize()
      : va.clone().multiplyScalar(Math.sin((1-t)*ang)/s)
          .addScaledVector(vb, Math.sin(t*ang)/s);

    const pts = greatCircle(a,b);
    paths.push(pts);
    globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), arcMat));
  }

  // city markers
  {
    const p = [], c = [], sz = [], al = [];
    const hot = sat2x('#F2A03A');
    for (const k of Object.keys(CITIES)){
      const v = ll(CITIES[k][0], CITIES[k][1], R * 1.004);
      p.push(v.x, v.y, v.z); c.push(hot.r, hot.g, hot.b); sz.push(3.75); al.push(1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p,3));
    g.setAttribute('aColor',   new THREE.Float32BufferAttribute(c,3));
    g.setAttribute('aSize',    new THREE.Float32BufferAttribute(sz,1));
    g.setAttribute('aAlpha',   new THREE.Float32BufferAttribute(al,1));
    globe.add(new THREE.Points(g, dotMat));
  }
}

// travelling pulses: one dot per route, index-stepped along its baked path
const pulseGeo = new THREE.BufferGeometry();
const phases = paths.map(() => Math.random());
const speeds = paths.map(() => 0.0022 + Math.random()*0.0026);
if (!STATIC) {
  const n = paths.length;
  pulseGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n*3),3));
  const c = [], sz = [], al = [];
  const bright = sat2x('#F5B04A');
  for (let i=0;i<n;i++){ c.push(bright.r,bright.g,bright.b); sz.push(3); al.push(1); }
  pulseGeo.setAttribute('aColor', new THREE.Float32BufferAttribute(c,3));
  pulseGeo.setAttribute('aSize',  new THREE.Float32BufferAttribute(sz,1));
  pulseGeo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(al,1));
  globe.add(new THREE.Points(pulseGeo, dotMat));
}

function movePulses(){
  if (STATIC) return;
  const arr = pulseGeo.attributes.position.array;
  for (let i=0;i<paths.length;i++){
    phases[i] = (phases[i] + speeds[i]) % 1;
    const pts = paths[i];
    const v = pts[Math.min(pts.length-1, (phases[i]*(pts.length-1))|0)];
    arr[i*3] = v.x; arr[i*3+1] = v.y; arr[i*3+2] = v.z;
  }
  pulseGeo.attributes.position.needsUpdate = true;
}

// ---------- interaction (Y-axis spin + hover ripple) ----------
const TILT_X = GLOBE_TILT_X; // fixed presentation tilt — drag never changes X
let rotY = STATIC ? DEFAULT_VIEW_ROTY : -1.15, velY = 0.0009, dragging = false, lastX = 0;
let hoverTarget = 0, hoverAmt = 0;
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const hitWorld = new THREE.Vector3();
const hitLocal = new THREE.Vector3();
const globeCenter = new THREE.Vector3();
const viewDir = new THREE.Vector3();
const coordsEl = document.getElementById('coords');
let pointerLat = null, pointerLon = null, pointerOn = false;

function xyzToLatLon(x, y, z) {
  // Inverse of land-dot frame: th = lon+180, (x,z) = c·(cos th, sin th)
  const r = Math.hypot(x, y, z) || 1;
  const lat = Math.asin(Math.max(-1, Math.min(1, y / r))) * 180 / Math.PI;
  const th = Math.atan2(z, x);
  let lon = th * 180 / Math.PI - 180;
  if (lon > 180) lon -= 360;
  if (lon < -180) lon += 360;
  return [lat, lon];
}

function fmt(n, d = 2) {
  const s = n < 0 ? '' : '+';
  return s + n.toFixed(d);
}

function updateCoordsHud(viewLat, viewLon) {
  if (!STATIC || !coordsEl) return;
  let t = `view  lat ${fmt(viewLat)}°  lon ${fmt(viewLon)}°\nrotY  ${fmt(rotY * 180 / Math.PI, 1)}°`;
  if (pointerOn && pointerLat != null) {
    t += `\ncursor lat ${fmt(pointerLat)}°  lon ${fmt(pointerLon)}°`;
  }
  coordsEl.textContent = t;
}

function sampleViewCenterLatLon() {
  // Ray from camera through screen center → globe surface (local)
  pointerNDC.set(0, 0);
  raycaster.setFromCamera(pointerNDC, camera);
  globe.updateMatrixWorld(true);
  globe.getWorldPosition(globeCenter);
  const sphere = new THREE.Sphere(globeCenter, R);
  if (raycaster.ray.intersectSphere(sphere, hitWorld)) {
    hitLocal.copy(hitWorld);
    globe.worldToLocal(hitLocal);
    return xyzToLatLon(hitLocal.x, hitLocal.y, hitLocal.z);
  }
  // Fallback if center ray misses (globe low in frame): nearest point toward camera
  viewDir.copy(camera.position).sub(globeCenter).normalize();
  hitWorld.copy(globeCenter).addScaledVector(viewDir, -R);
  hitLocal.copy(hitWorld);
  globe.worldToLocal(hitLocal);
  return xyzToLatLon(hitLocal.x, hitLocal.y, hitLocal.z);
}

function updatePointerCoords(e) {
  if (!STATIC) return;
  const rect = canvas.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  globe.getWorldPosition(globeCenter);
  const sphere = new THREE.Sphere(globeCenter, R);
  if (raycaster.ray.intersectSphere(sphere, hitWorld)) {
    hitLocal.copy(hitWorld);
    globe.worldToLocal(hitLocal);
    const ll = xyzToLatLon(hitLocal.x, hitLocal.y, hitLocal.z);
    pointerLat = ll[0];
    pointerLon = ll[1];
    pointerOn = true;
  } else {
    pointerOn = false;
  }
}

function updateHover(e){
  if (STATIC) {
    updatePointerCoords(e);
    return;
  }
  const rect = canvas.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  globe.getWorldPosition(globeCenter);
  const sphere = new THREE.Sphere(globeCenter, R);
  if (raycaster.ray.intersectSphere(sphere, hitWorld)) {
    hitLocal.copy(hitWorld);
    globe.worldToLocal(hitLocal);
    dotMat.uniforms.uHover.value.copy(hitLocal);
    hoverTarget = 1;
  } else {
    hoverTarget = 0;
  }
}

canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX;
  canvas.setPointerCapture(e.pointerId);
  updateHover(e);
});
canvas.addEventListener('pointerup',   () => { dragging = false; });
canvas.addEventListener('pointerleave', () => { hoverTarget = 0; });
canvas.addEventListener('pointermove', e => {
  updateHover(e);
  if (!dragging) return;
  const dx = e.clientX - lastX;
  velY = dx * 0.00042;
  rotY += dx * 0.005;
  lastX = e.clientX;
});
if (STATIC) {
  canvas.addEventListener('pointerleave', () => { pointerOn = false; });
}

function resize(){
  const w = innerWidth, h = innerHeight;
  const dpr = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;
  camera.position.setLength(aspect < REF_ASPECT ? BASE_Z * (REF_ASPECT / aspect) : BASE_Z);
  camera.updateProjectionMatrix();
  // keep dots a constant on-screen pixel size regardless of viewport
  dotMat.uniforms.uScale.value = dpr * camera.position.length() * DOT_PX;
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function tick(){
  const dt = clock.getDelta();
  if (!STATIC) movePulses();
  if (!dragging) {
    if (STATIC && faceEurope && faceSpinAmt < 1) {
      stepFaceSpin(dt);
    } else {
      rotY += velY; velY += (0.0009 - velY) * 0.02;
    }
  }
  globe.rotation.y = rotY;
  globe.rotation.x = TILT_X;

  if (STATIC) stepMorph(dt);
  if (STATIC) stepColorBlend(dt);

  if (STATIC) {
    const [vLat, vLon] = sampleViewCenterLatLon();
    updateCoordsHud(vLat, vLon);
  }

  if (!STATIC) {
    hoverAmt += (hoverTarget - hoverAmt) * Math.min(1, dt * 10);
    dotMat.uniforms.uHoverAmt.value = hoverAmt;
    dotMat.uniforms.uTime.value += dt;
  } else {
    dotMat.uniforms.uHoverAmt.value = 0;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

resize();
tick();
</script>
</body>
</html>
