<!-- Shared innovation editorial sheet — filled from content/innovation/{slug}.json -->
<article class="eudi eudi--sheet" data-innovation-root>
  <div class="eudi__column">
    <section class="eudi__block" aria-labelledby="innovation-sheet-title">
      <h1 id="innovation-sheet-title" class="eudi__title" data-bind="hero.headline"></h1>
      <p class="eudi__lead" data-bind="hero.lead"></p>
      <a class="btn btn-primary eudi__btn" data-bind="hero.cta.label" data-bind-href="hero.cta.href" href="#contact"></a>
    </section>
    <div data-bind-sections></div>
  </div>
</article>
