<div class="avc-window" role="img" aria-label="Age Verification Connector in a macOS browser window">
      <div class="avc-window__frame">
        <div class="avc-window__chrome">
          <div class="avc-window__traffic" aria-hidden="true">
            <span class="avc-window__dot avc-window__dot--close"></span>
            <span class="avc-window__dot avc-window__dot--min"></span>
            <span class="avc-window__dot avc-window__dot--zoom"></span>
          </div>
          <div class="avc-window__url">
            <span class="avc-window__url-pill">age.dev</span>
          </div>
        </div>

        <div class="avc-window__stage">
          <div class="avc" aria-label="Age Verification Connector dashboard">
          <div class="avc__card">
            <header class="avc__head">
              <div class="avc__identity">
                <span class="avc__avatar" aria-hidden="true"></span>
                <div>
                  <h3 class="avc__title">Dashboard</h3>
                  <p class="avc__subtitle">Age Verification Connector</p>
                </div>
              </div>
              <ul class="avc__meta">
                <li>
                  <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.75"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
                  Account Created: November 19, 2025
                </li>
                <li>
                  <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Business Account
                </li>
              </ul>
            </header>

            <div class="avc__body">
              <div class="avc__stats">
                <div class="avc__stat">
                  <div class="avc__stat-top">
                    <span class="avc__stat-value">0</span>
                    <svg class="avc__stat-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </div>
                  <span class="avc__stat-label">Total Verifications</span>
                </div>
                <div class="avc__stat">
                  <div class="avc__stat-top">
                    <span class="avc__stat-value">0</span>
                    <svg class="avc__stat-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
                  </div>
                  <span class="avc__stat-label">Clients</span>
                </div>
                <div class="avc__stat">
                  <div class="avc__stat-top">
                    <span class="avc__stat-value">Free</span>
                    <svg class="avc__stat-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V5M4 16l5-6 4 3 7-8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </div>
                  <span class="avc__stat-label">Current Plan</span>
                </div>
              </div>

              <div class="avc__actions">
                <button class="avc__btn avc__btn--primary" type="button">
                  <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
                  Create Client
                </button>
                <button class="avc__btn avc__btn--primary" type="button">
                  <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.25" stroke="currentColor" stroke-width="1.75"/><path d="M5 19c1.2-3.2 3.4-4.8 7-4.8s5.8 1.6 7 4.8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="18.5" cy="15.5" r="2.75" stroke="currentColor" stroke-width="1.5"/><path d="M18.5 14.3v2.4M17.3 15.5h2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                  Manage Clients
                </button>
                <button class="avc__btn avc__btn--primary" type="button">
                  <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.75"/><path d="M7 15v-3M12 15V8M17 15v-5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
                  View Metrics
                </button>
              </div>
            </div>
          </div>

          <nav class="avc__nav" aria-label="Connector sections">
            <button class="avc__nav-btn" type="button">
              <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.75"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
              Settings
            </button>
            <button class="avc__nav-btn" type="button">
              <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.75"/><path d="M3 11h18M7 15h3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
              Billing
            </button>
            <button class="avc__nav-btn is-active" type="button" aria-current="page">
              <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.75"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Audit Log
            </button>
            <button class="avc__nav-btn" type="button">
              <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.75"/><circle cx="12" cy="12" r="3.25" stroke="currentColor" stroke-width="1.75"/><path d="M12 3.75v2.5M12 17.75v2.5M3.75 12h2.5M17.75 12h2.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
              Support
            </button>
          </nav>

          <footer class="avc__foot">
            <div class="avc__brand">
              <span class="avc__mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none"><path d="M16 3l11 5v8c0 7.2-4.4 11.6-11 14C9.4 27.6 5 23.2 5 16V8l11-5z" fill="currentColor"/><circle cx="12.5" cy="15" r="2" fill="#fff"/><circle cx="19.5" cy="15" r="2" fill="#fff"/><circle cx="16" cy="20.5" r="2" fill="#fff"/><path d="M12.5 15h7M14.2 16.8l1.8 3.2M17.8 16.8L16 20" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
              </span>
              <div>
                <div class="avc__brand-name">Age Verification Connector</div>
                <div class="avc__brand-sub">powered by Scytales</div>
              </div>
            </div>

            <div class="avc__user">
              <span class="avc__user-avatar" aria-hidden="true">AP</span>
              <span class="avc__user-email">apapaxanthis@scytales.com</span>
            </div>

            <div class="avc__foot-actions">
              <button class="avc__btn avc__btn--outline" type="button">
                <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
                Dashboard
              </button>
              <button class="avc__btn avc__btn--outline" type="button">
                <svg class="avc__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 7V5a2 2 0 012-2h7a2 2 0 012 2v14a2 2 0 01-2 2h-7a2 2 0 01-2-2v-2M15 12H4m0 0l3-3M4 12l3 3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Logout
              </button>
            </div>
          </footer>
        </div>
      </div>
      </div>
    </div>
